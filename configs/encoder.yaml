# DyGFormer-HGT encoder hyperparameters (paper Sec. 5).

encoder:
  d_model: 256
  n_heads: 8
  n_layers: 3
  dropout: 0.1
  time_dim: 64
  feature_dim: 128
  pool: mean+gru

trainer:
  lr: 5.0e-4
  weight_decay: 0.01
  epochs: 30
  batch_size: 64
  grad_clip: 1.0
  coverage_weight: 0.1
  output_dir: runs/conformalguard
  log_every: 50
  seed: 1234

limit_train: 9920
limit_val: 1240
